name: Deploy friends homepage (Azure)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  # Built on macOS so the Mac app can be code-signed; the Azure deploy action only runs on Linux.
  build:
    runs-on: macos-latest
    steps:
      - name: Check the Azure token is set
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the AZURE_STATIC_WEB_APPS_API_TOKEN repository secret first (see docs/AZURE.md)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version shown on the site
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: scripts/build-site.sh
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site/dist
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site/dist
          skip_app_build: true
          skip_api_build: true
